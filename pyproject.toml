[project]
name = "e-civil-servant-learning-assistant"
version = "0.1.0"
description = "Windows desktop assistant for E government employee learning website."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.45.0",
    "PySide6>=6.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

